services:
  # ==================== FRONTEND ====================
  frontend:
    build: ./geotrail-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== BACKEND ====================
  backend:
    build: ./geotrail-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: geotrail
      DB_USERNAME: geotrail
      DB_PASSWORD: ${DB_PASSWORD:-geotrail_dev}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-256-bits-long-at-minimum}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== DATABASE ====================
  postgres:
    image: postgis/postgis:16-3.4
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: geotrail
      POSTGRES_USER: geotrail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geotrail_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotrail"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== CACHE ====================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== OBJECT STORAGE ====================
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO console UI
    restart: unless-stopped
    networks:
      - geotrail

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  geotrail:
    driver: bridge
