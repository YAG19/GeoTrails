services:
  # ==================== FRONTEND ====================
  frontend:
    build: ./geotrail-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== BACKEND ====================
  backend:
    build: ./geotrail-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: geotrail
      DB_USERNAME: geotrail
      DB_PASSWORD: ${DB_PASSWORD:-geotrail_dev}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin} 
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-must-be-256-bits-long-at-minimum}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== DATABASE ====================
  # PostGIS + pgvector. The stock postgis/postgis image has no pgvector, which the
  # RAG feature (timeline_embeddings) requires, so we build a thin image that adds it.
  postgres:
    build: ./geotrail-backend/docker/postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./geotrail-backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: geotrail
      POSTGRES_USER: geotrail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geotrail_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotrail"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== CACHE ====================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - geotrail

  # ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - geotrail

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - geotrail

volumes:
  pgdata:
  redisdata:
  grafanadata:

networks:
  geotrail:
    driver: bridge
