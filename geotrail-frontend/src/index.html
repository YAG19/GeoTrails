<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoTrail</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- light dark = follow the OS. ThemeService rewrites this to pin a scheme. -->
  <meta name="color-scheme" content="light dark" />
  <script>
    // Apply a stored theme override before first paint (prevents a flash of the wrong theme).
    try {
      var s = localStorage.getItem('gt-theme');
      if (s === 'light' || s === 'dark') document.querySelector('meta[name="color-scheme"]').content = s;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- GeoTrail design fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <!-- Leaflet CSS is bundled via angular.json "styles"; no CDN copy needed. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
