server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: geotrail
  devtools:
    restart:
      enabled: true

  # --- Virtual Threads (Java 21) ---
  threads:
    virtual:
      enabled: true

  # --- Database ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://172.17.0.1/geotrail}
    username: ${SPRING_DATASOURCE_USERNAME:geotrail}
    password: ${SPRING_DATASOURCE_PASSWORD:geotrail_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      data-source-properties:
        sslmode: require

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema, Hibernate only validates
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false   # Disable OSIV — avoids lazy loading traps

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:172.17.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # --- File upload ---
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# --- JWT ---
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-please}
    access-token-expiration-ms: 900000     # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

# --- MinIO ---
minio:
  endpoint: ${MINIO_ENDPOINT:http://172.17.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: geotrail-imports

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
    env:
      enabled: true
      show-values: always
    configprops:
      enabled: true
      show-values: always
    loggers:
      enabled: true
    metrics:
      enabled: true
    threaddump:
      enabled: true
    heapdump:
      enabled: true
    beans:
      enabled: true
    mappings:
      enabled: true
    conditions:
      enabled: true
    scheduledtasks:
      enabled: true
    caches:
      enabled: true
    httptrace:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

# --- OpenAPI ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# --- Logging ---
logging:
  level:
    com.geotrail: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO


